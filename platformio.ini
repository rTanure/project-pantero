[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<uno/>
lib_extra_dirs = include   ; QC3Control vive em include/QC3Control

[env:esp32]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32/>
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0   ; servidor web/WebSocket no núcleo 0; núcleo 1 fica com o vídeo
lib_deps =
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer