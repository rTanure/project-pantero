[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<uno/>
lib_extra_dirs = include   ; QC3Control vive em include/QC3Control

[env:esp32]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32/>
board_build.filesystem = littlefs
lib_deps =
    esp32async/AsyncTCP
    esp32async/ESPAsyncWebServer