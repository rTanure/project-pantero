; Pantero: dois firmwares (src/uno e src/esp32) e um programa Python no PC (pc/) que se conecta ao Wi-Fi do ESP32.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<uno/>
lib_extra_dirs = include   ; QC3Control vive em include/QC3Control

[env:esp32]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32/>
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    adafruit/Adafruit SSD1306   ; display OLED (puxa Adafruit GFX e BusIO)
